name: mad-sync
services:
  server:
    image: node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    restart: unless-stopped
    init: true
    user: "65532:65532"
    working_dir: /app
    command: [node, server.mjs]
    environment:
      NODE_ENV: production
      MAD_DATABASE: /data/history.sqlite
      MAD_HOST: 0.0.0.0
      MAD_PORT: "8787"
    ports:
      - "127.0.0.1:28787:8787"
    volumes:
      - ../:/app:ro
      - /var/lib/mad-sync:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/v1/badges').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
