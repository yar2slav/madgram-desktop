name: mad release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: publish the release and its signed update feed after successful checks
        type: boolean
        default: true
      build:
        description: mad build number, empty for automatic
        type: string
        default: ''
      macos:
        description: also build macos, arm64 and x86_64 joined into one app
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mad-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      counter: ${{ steps.version.outputs.counter }}
      base: ${{ steps.version.outputs.base }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SDK: '10.0.26100.0'
      VCVARS_VER: '14.44'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: checkout mad
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: mad
          persist-credentials: false

      - name: check the russian release text
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $previous = gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $previous = "$previous".Trim()
          if ($previous) {
            git -C mad fetch --quiet --depth 1 origin "refs/tags/${previous}:refs/tags/${previous}"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          python mad/ci/mad-changelog.py --check --previous "$previous"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: validate inputs and credentials
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
          REQUESTED_BUILD: ${{ inputs.build }}
        run: |
          if ($env:TDESKTOP_API_ID -notmatch '^[1-9][0-9]*$' -or $env:TDESKTOP_API_HASH -notmatch '^[a-fA-F0-9]{32}$') {
            throw 'set repository secrets TDESKTOP_API_ID and TDESKTOP_API_HASH'
          }
          $upstream = (Get-Content mad/UPSTREAM -Raw).Trim()
          if ($upstream -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'invalid upstream tag' }
          $build = if ($env:REQUESTED_BUILD) { $env:REQUESTED_BUILD -replace '\s', '' } else { $env:GITHUB_RUN_NUMBER }
          if ($build -notmatch '^[1-9][0-9]*$') { throw 'build must be a positive number, like 16' }
          "UPSTREAM_TAG=$upstream" >> $env:GITHUB_ENV
          "RELEASE_TAG=$upstream-mad.$build" >> $env:GITHUB_ENV
          "MAD_BUILD=$build" >> $env:GITHUB_ENV
          "TBUILD=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\link" | Out-Null
          "TEMP=$env:RUNNER_TEMP\link" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP\link" >> $env:GITHUB_ENV
          Get-PSDrive C, D -ErrorAction SilentlyContinue | Format-Table Name, @{n='free GB';e={[math]::Round($_.Free / 1GB, 1)}}

      - name: clone and apply the exact patch queue
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf true
          git config --global user.name mad-ci
          git config --global user.email ci@mad.invalid
          git clone --quiet --branch $env:UPSTREAM_TAG --recurse-submodules https://github.com/telegramdesktop/tdesktop.git tdesktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python mad/tele.py --tdesktop tdesktop apply
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python mad/ci/check-translations.py --tdesktop tdesktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: read versions and cache key
        id: version
        shell: bash
        run: |
          base=$(grep -oE 'constexpr auto AppVersion = [0-9]+' tdesktop/Telegram/SourceFiles/core/version.h | grep -oE '[0-9]+$')
          if [ -z "$base" ]; then
            echo "::error::no AppVersion in core/version.h"
            exit 1
          fi
          prepare_hash=$(sha256sum < tdesktop/Telegram/build/prepare/prepare.py | cut -c1-16)
          echo "CACHE_KEY=mad-win64d-$SDK-$VCVARS_VER-$prepare_hash" >> "$GITHUB_ENV"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "counter=$MAD_BUILD" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake || true

      - name: restore libraries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.TBUILD }}\ThirdParty
            ${{ env.TBUILD }}\Libraries
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-
            mad-win64d-

      - name: remember library state
        shell: bash
        run: |
          state=$( { find "$TBUILD/ThirdParty/cache_keys" "$TBUILD/Libraries/win64/cache_keys" -type f -exec sha256sum {} + 2>/dev/null || true; } | sort | sha256sum)
          echo "LIBS_STATE=$state" >> "$GITHUB_ENV"

      - name: configure nuget source
        run: |
          $config = '<configuration><packageSources><clear/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></packageSources></configuration>'
          $directory = Join-Path $env:APPDATA NuGet
          New-Item -ItemType Directory -Force $directory | Out-Null
          Set-Content -LiteralPath (Join-Path $directory NuGet.Config) -Value $config -Encoding utf8

      - name: install atl for the pinned toolset
        timeout-minutes: 20
        run: |
          $prepared = "$env:TBUILD\Libraries\win64\cache_keys\mad-prepared"
          if ((Test-Path $prepared) -and (Get-Content $prepared -Raw).Trim() -eq $env:CACHE_KEY) {
            "libraries were fully prepared for this prepare.py, atl is not needed"; exit 0
          }
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -products * -property installationPath
          $atl = "$vs\VC\Tools\MSVC\14.44.*\atlmfc\include\atlbase.h"
          if (Test-Path $atl) { exit 0 }
          $process = Start-Process -Wait -PassThru -WindowStyle Hidden "$installer\vs_installer.exe" -ArgumentList 'modify', '--installPath', "`"$vs`"", '--add', 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL', '--quiet', '--norestart', '--nocache'
          if ($process.ExitCode -notin @(0, 3010)) { exit $process.ExitCode }
          if (-not (Test-Path $atl)) { throw 'required atl component missing' }

      - name: prepare libraries
        id: prepare
        shell: cmd
        run: |
          call mad\ci\msvc.cmd || exit /b 1
          set "keys=%TBUILD%\Libraries\win64\cache_keys"
          if exist "%keys%\tdesktop_rust" if not exist "%TBUILD%\Libraries\win64\tdesktop_rust\out\src\wallet_engine\wallet_engine.cpp" del "%keys%\tdesktop_rust" "%keys%\tlottie" "%keys%\wallet-engine"
          tdesktop\Telegram\build\prepare\win.bat silent

      - name: trim libraries
        id: trim
        if: always() && steps.prepare.outcome != 'skipped'
        shell: bash
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        run: |
          df -h /c /d 2>/dev/null || true
          libs="$TBUILD/Libraries/win64"
          if [ ! -d "$libs" ]; then
            exit 0
          fi
          find "$libs" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/src/wallet_engine/*' ')' -type f ')' -o -empty ')' -delete
          if [ "$PREPARE_OUTCOME" = success ]; then
            echo "$CACHE_KEY" > "$libs/cache_keys/mad-prepared"
          else
            rm -f "$libs/cache_keys/mad-prepared"
          fi
          state=$( { find "$TBUILD/ThirdParty/cache_keys" "$libs/cache_keys" -type f -exec sha256sum {} + 2>/dev/null || true; } | sort | sha256sum)
          if [ "$state" != "$LIBS_STATE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: save libraries
        id: save
        if: always() && steps.trim.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.TBUILD }}\ThirdParty
            ${{ env.TBUILD }}\Libraries
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: drop older library caches
        if: always() && steps.save.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          current="$CACHE_KEY-${{ github.run_id }}-${{ github.run_attempt }}"
          gh cache list --key mad-win64d- --limit 100 --json id,key --jq ".[] | select(.key != \"$current\") | .id" \
            | xargs -r -n1 gh cache delete

      - name: set up ccache
        shell: bash
        env:
          CCACHE_VERSION: 4.14.1
          CCACHE_SHA256: 6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4
        run: |
          zip="$RUNNER_TEMP/ccache.zip"
          curl -fsSL -o "$zip" "https://github.com/ccache/ccache/releases/download/v$CCACHE_VERSION/ccache-$CCACHE_VERSION-windows-x86_64.zip"
          if [ "$(sha256sum < "$zip" | cut -c1-64)" != "$CCACHE_SHA256" ]; then
            echo "::error::ccache-$CCACHE_VERSION-windows-x86_64.zip doesn't have the pinned sha256"
            exit 1
          fi
          7z e -y -o"$RUNNER_TEMP/ccache" "$zip" "ccache-$CCACHE_VERSION-windows-x86_64/ccache.exe" > /dev/null
          temp=$(cygpath -m "$RUNNER_TEMP")
          {
            echo "CCACHE_EXE=$temp/ccache/ccache.exe"
            echo "CCACHE_DIR=$temp/ccache-cache"
            echo "CCACHE_MAXSIZE=3G"
            echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime"
            echo "CCACHE_DEPEND=true"
          } >> "$GITHUB_ENV"

      - name: restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.CCACHE_DIR }}
          key: mad-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mad-ccache-

      - name: reset ccache statistics
        shell: bash
        run: |
          "$CCACHE_EXE" --version | head -1
          "$CCACHE_EXE" -z

      - name: build and run tests
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          python mad/build-mad.py --config Release --qt-prefix Libraries/win64/Qt-6.11.2 --build-number $env:MAD_BUILD --launcher $env:CCACHE_EXE --tests --jobs $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test mad/server/server.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: build mad
        run: |
          foreach ($jobs in @($env:NUMBER_OF_PROCESSORS, 2, 1)) {
            python mad/build-mad.py --config Release --qt-prefix Libraries/win64/Qt-6.11.2 --build-number $env:MAD_BUILD --launcher $env:CCACHE_EXE --jobs $jobs
            if (-not $LASTEXITCODE) { exit 0 }
            "build with $jobs jobs failed, continuing with fewer"
          }
          exit 1

      - name: save ccache
        id: ccache
        if: always() && env.CCACHE_EXE != ''
        shell: bash
        run: |
          "$CCACHE_EXE" -s
          misses=$("$CCACHE_EXE" --print-stats | awk '$1 == "cache_miss" { print $2 }')
          echo "ccache misses: ${misses:-0}"
          if [ "${misses:-0}" -gt 100 ]; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi

      - name: upload ccache
        id: upload-ccache
        if: always() && steps.ccache.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.CCACHE_DIR }}
          key: mad-ccache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: drop older ccaches
        if: always() && steps.upload-ccache.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --key mad-ccache- --limit 100 --json id,key --jq '.[] | select(.key != "mad-ccache-${{ github.run_id }}-${{ github.run_attempt }}") | .id' \
            | xargs -r -n1 gh cache delete

      - name: package and verify the standalone executable
        run: |
          python mad/package-mad.py --output "$env:GITHUB_WORKSPACE/dist/mad.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python mad/ci/release-mad.py --tag $env:RELEASE_TAG --output dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: save verified build artifacts
        id: artifacts
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-win64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: wait for github artifact storage
        if: steps.artifacts.outcome == 'failure'
        run: Start-Sleep -Seconds 600

      - name: save verified build artifacts again
        if: steps.artifacts.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-win64
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  macos-libs:
    if: inputs.macos
    runs-on: macos-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      key: ${{ steps.key.outputs.key }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: checkout mad
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: mad
          persist-credentials: false

      - name: set up
        run: bash mad/ci/macos-setup.sh

      - name: clone and apply the exact patch queue
        run: |
          upstream=$(tr -d '[:space:]' < mad/UPSTREAM)
          git -c advice.detachedHead=false clone --quiet --depth 1 --recurse-submodules --shallow-submodules \
            --branch "$upstream" https://github.com/telegramdesktop/tdesktop.git tdesktop
          git config --global user.name mad-ci
          git config --global user.email ci@mad.invalid
          python3 mad/tele.py --tdesktop "$GITHUB_WORKSPACE/tdesktop" apply

      - name: pick the libraries
        id: key
        run: |
          key=macos-$(shasum -a 256 < tdesktop/Telegram/build/prepare/prepare.py | cut -c1-16)
          echo "LIBS_KEY=$key" >> "$GITHUB_ENV"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: restore libraries
        run: |
          bash mad/ci/macos-libs.sh pull "$LIBS_KEY" latest || true
          if [ -f Libraries/cache_keys/tdesktop_rust ] && [ ! -f Libraries/local/src/wallet_engine/wallet_engine.cpp ]; then
            rm -f Libraries/cache_keys/tdesktop_rust Libraries/cache_keys/tlottie Libraries/cache_keys/wallet-engine Libraries/cache_keys/mad-prepared
          fi
          state=$( { find ThirdParty/cache_keys Libraries/cache_keys -type f -exec shasum -a 256 {} + 2>/dev/null || true; } | sort | shasum -a 256)
          echo "LIBS_STATE=$state" >> "$GITHUB_ENV"
          for s in tlottie wallet-engine; do
            if [ -f "Libraries/cache_keys/$s" ] && [ ! -f "Libraries/$s/Cargo.toml" ]; then
              rm -f "Libraries/cache_keys/$s"
            fi
          done
          if [ "$(cat Libraries/cache_keys/mad-prepared 2>/dev/null)" = "$LIBS_KEY" ]; then
            echo "READY=true" >> "$GITHUB_ENV"
          fi

      - name: prepare libraries
        id: prepare
        if: env.READY != 'true'
        timeout-minutes: 300
        run: ./tdesktop/Telegram/build/prepare/mac.sh silent

      - name: trim and save libraries
        if: always() && steps.prepare.outcome != 'skipped'
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        run: |
          [ -d Libraries ] || exit 0
          find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/src/wallet_engine/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete
          if [ "$PREPARE_OUTCOME" = success ]; then
            echo "$LIBS_KEY" > Libraries/cache_keys/mad-prepared
          fi
          du -sh Libraries ThirdParty || true
          state=$( { find ThirdParty/cache_keys Libraries/cache_keys -type f -exec shasum -a 256 {} + 2>/dev/null || true; } | sort | shasum -a 256)
          if [ "$state" != "$LIBS_STATE" ]; then
            bash mad/ci/macos-libs.sh push "$LIBS_KEY"
          fi

  macos-build:
    needs: macos-libs
    runs-on: macos-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    permissions:
      contents: read
      packages: read
    env:
      LIBS_KEY: ${{ needs.macos-libs.outputs.key }}
      ARCH: ${{ matrix.arch }}
      GH_TOKEN: ${{ github.token }}
      REQUESTED_BUILD: ${{ inputs.build }}
    steps:
      - name: checkout mad
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: mad
          persist-credentials: false

      - name: set up
        run: bash mad/ci/macos-setup.sh

      - name: clone and apply the exact patch queue
        run: |
          upstream=$(tr -d '[:space:]' < mad/UPSTREAM)
          build=${REQUESTED_BUILD:-$GITHUB_RUN_NUMBER}
          build=${build//[[:space:]]/}
          if ! [[ "$build" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::build must be a positive number, like 16"
            exit 1
          fi
          echo "MAD_BUILD=$build" >> "$GITHUB_ENV"
          git -c advice.detachedHead=false clone --quiet --depth 1 --recurse-submodules --shallow-submodules \
            --branch "$upstream" https://github.com/telegramdesktop/tdesktop.git tdesktop
          git config --global user.name mad-ci
          git config --global user.email ci@mad.invalid
          python3 mad/tele.py --tdesktop "$GITHUB_WORKSPACE/tdesktop" apply

      - name: restore libraries
        run: |
          bash mad/ci/macos-libs.sh pull "$LIBS_KEY"
          if [ "$(cat Libraries/cache_keys/mad-prepared 2>/dev/null)" != "$LIBS_KEY" ]; then
            echo "::error::the macos libraries for $LIBS_KEY aren't fully prepared yet, re-run once macos-libs finishes"
            exit 1
          fi

      - name: build
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ "$ARCH" != "$(uname -m)" ] && ! arch "-$ARCH" /usr/bin/true 2> /dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          cd tdesktop/Telegram
          ./configure.sh -D CMAKE_CONFIGURATION_TYPES=Release -D CMAKE_OSX_ARCHITECTURES="$ARCH" \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D TDESKTOP_API_ID="$API_ID" -D TDESKTOP_API_HASH="$API_HASH" -D TELE_BUILD="$MAD_BUILD"
          cmake --build ../out --config Release --parallel --target Telegram -- -quiet

      - name: pack
        run: |
          release="$GITHUB_WORKSPACE/tdesktop/out/Release"
          test -x "$release/mad.app/Contents/MacOS/mad"
          archs=$(lipo -archs "$release/mad.app/Contents/MacOS/mad")
          if [ "$archs" != "$ARCH" ]; then
            echo "::error::the $ARCH build holds $archs"
            exit 1
          fi
          COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs --no-acls -cf "mad-macos-$ARCH.tar" \
            -C "$release" mad.app -C "$GITHUB_WORKSPACE/tdesktop/Telegram/Telegram" Telegram.entitlements

      - name: upload the build
        id: artifacts
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-app-${{ matrix.arch }}
          path: mad-macos-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: wait for github artifact storage
        if: steps.artifacts.outcome == 'failure'
        run: sleep 600

      - name: upload the build again
        if: steps.artifacts.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-app-${{ matrix.arch }}
          path: mad-macos-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  macos:
    needs: macos-build
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      REQUESTED_BUILD: ${{ inputs.build }}
    steps:
      - name: checkout mad
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: mad
          persist-credentials: false

      - name: set up
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          upstream=$(tr -d '[:space:]' < mad/UPSTREAM)
          build=${REQUESTED_BUILD:-$GITHUB_RUN_NUMBER}
          echo "RELEASE_TAG=$upstream-mad.${build//[[:space:]]/}" >> "$GITHUB_ENV"

      - name: download the builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: macos-app-*
          path: ${{ runner.temp }}/parts

      - name: join the architectures
        run: |
          parts="$RUNNER_TEMP/parts"
          for arch in x86_64 arm64; do
            mkdir -p "$parts/$arch"
            tar -xf "$parts/macos-app-$arch/mad-macos-$arch.tar" -C "$parts/$arch"
          done
          bash mad/ci/macos-merge.sh "$parts/x86_64" "$parts/arm64" out/Release
          mv out/Release/Telegram.entitlements "$RUNNER_TEMP/Telegram.entitlements"

      - name: sign and package
        run: |
          app=out/Release/mad.app
          test -x "$app/Contents/MacOS/mad"
          lipo -archs "$app/Contents/MacOS/mad"
          strip "$app/Contents/MacOS/mad"
          find "$app/Contents/Helpers" -type f -perm -u+x -print0 2>/dev/null \
            | xargs -0 -I{} codesign --force --sign - --timestamp=none "{}"
          codesign --force --sign - --timestamp=none --entitlements "$RUNNER_TEMP/Telegram.entitlements" "$app"
          codesign --verify --strict --deep --verbose=2 "$app"
          mkdir -p dist
          zip="$GITHUB_WORKSPACE/dist/mad-$RELEASE_TAG-macos.zip"
          (cd out/Release && zip -qry -X "$zip" mad.app)
          [ -z "$(unzip -Z1 "$zip" | grep -v '^mad\.app/')" ]
          dmg="$GITHUB_WORKSPACE/dist/mad-$RELEASE_TAG-macos.dmg"
          rm -rf "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/mounted" && mkdir "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/mounted"
          ditto "$app" "$RUNNER_TEMP/dmg/mad.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -quiet -volname mad -srcfolder "$RUNNER_TEMP/dmg" -fs HFS+ -format UDZO -ov "$dmg"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mounted" "$dmg"
          codesign --verify --strict --deep "$RUNNER_TEMP/mounted/mad.app"
          hdiutil detach -quiet "$RUNNER_TEMP/mounted"

      - name: upload the build
        id: artifacts
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: wait for github artifact storage
        if: steps.artifacts.outcome == 'failure'
        run: sleep 600

      - name: upload the build again
        if: steps.artifacts.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: [windows, macos]
    if: ${{ always() && inputs.publish && needs.windows.result == 'success' && needs.macos.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.windows.outputs.tag }}
      BASE: ${{ needs.windows.outputs.base }}
      COUNTER: ${{ needs.windows.outputs.counter }}
    steps:
      - name: checkout mad
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: mad
          persist-credentials: false
          fetch-depth: 0

      - name: download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-win64
          path: dist

      - name: download the macos build
        if: needs.macos.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-macos
          path: dist

      - name: sign the update feed
        env:
          UPDATE_KEY: ${{ secrets.MAD_UPDATE_KEY }}
        working-directory: dist
        run: |
          if [ -z "$UPDATE_KEY" ]; then
            echo "::error::set the repository secret MAD_UPDATE_KEY"
            exit 1
          fi
          zip="mad-$TAG-win64.zip"
          [ -n "$(unzip -Z1 "$zip" mad.exe)" ]
          printf '{"tag":"%s","base":%s,"counter":%s,"url":"%s","zip_sha256":"%s","exe_sha256":"%s"}' \
            "$TAG" "$BASE" "$COUNTER" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$zip" \
            "$(sha256sum < "$zip" | cut -c1-64)" \
            "$(unzip -p "$zip" mad.exe | sha256sum | cut -c1-64)" > feed.json
          openssl pkeyutl -sign -rawin -inkey <(printf '%s\n' "$UPDATE_KEY") -in feed.json -out feed.sig
          openssl pkeyutl -verify -rawin -pubin -inkey ../mad/ci/update-public-key.pem -in feed.json -sigfile feed.sig
          printf '{"feed":"%s","signature":"%s"}\n' "$(base64 -w0 feed.json)" "$(base64 -w0 feed.sig)" > mad-update-win64.json
          rm feed.json feed.sig

      - name: write what's new
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')
          echo "PREVIOUS=$previous" >> "$GITHUB_ENV"
          python3 mad/ci/mad-changelog.py --tag "$TAG" --previous "$previous"             --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --output dist

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: dist
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::release $TAG already exists, choose a new build number"
            exit 1
          fi
          files=(mad.exe "mad-$TAG-win64.zip" mad-update-win64.json mad-changelog.json SHA256SUMS source-manifest.json)
          if [ -f "mad-$TAG-macos.dmg" ]; then
            sha256sum "mad-$TAG-macos.dmg" "mad-$TAG-macos.zip" >> SHA256SUMS
            files+=("mad-$TAG-macos.dmg" "mad-$TAG-macos.zip")
          else
            sed -i '/macos/d' release-notes.md
          fi
          gh release create "$TAG" "${files[@]}" \
            --target "$GITHUB_SHA" --title "mad $COUNTER · ${TAG%-mad.*}" --notes-file release-notes.md --latest

      - name: announce in the channel
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.MAD_BOT_TOKEN }}
          CHANNEL: ${{ secrets.MAD_CHANNEL }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHANNEL" ]; then
            echo "no MAD_BOT_TOKEN / MAD_CHANNEL secrets, not announcing"
            exit 0
          fi
          macos=()
          if [ -f "dist/mad-$TAG-macos.dmg" ]; then
            macos=(--macos)
          fi
          python3 mad/ci/mad-announce.py --changelog dist/mad-changelog.json --previous "$PREVIOUS" \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "${macos[@]}"
